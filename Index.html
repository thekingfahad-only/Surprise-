<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Question For You ❤️</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating background hearts */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      bottom: -100px;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Card */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(214, 51, 132, 0.3);
      text-align: center;
      max-width: 380px;
      width: 90%;
      z-index: 10;
      animation: popIn 0.8s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart-gif {
      font-size: 70px;
      margin-bottom: 10px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      color: #e63946;
      font-size: 2.5rem;
      margin-bottom: 15px;
      line-height: 1.2;
    }

    p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 60px;
    }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
      z-index: 12;
    }

    #noBtn {
      background: #6c757d;
      color: white;
      position: absolute;
      z-index: 11;
      touch-action: none;
    }

    /* Success Screen */
    .hidden {
      display: none;
    }

    .celebration-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d63384;
      margin-top: 15px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- Audio Player (Plays romantic music automatically on first tap) -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Background Hearts Container -->
  <div id="heartsContainer"></div>

  <!-- Proposal Card -->
  <div class="card" id="card">
    <div class="heart-gif">💖</div>
    <h1 id="title">Will You Be Mine Forever?</h1>
    <p id="subtext">You make every single day brighter... ✨</p>

    <div class="buttons" id="btnGroup">
      <button id="yesBtn" onclick="sayYes()">YES! 🥰</button>
      <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton()">No 😢</button>
    </div>
  </div>

  <script>
    // Audio Autoplay Handler for Mobile
    const music = document.getElementById('bgMusic');
    document.addEventListener('click', () => {
      if (music.paused) {
        music.play().catch(() => {});
      }
    }, { once: true });

    // Generate Floating Background Hearts
    const heartsContainer = document.getElementById('heartsContainer');
    const heartSymbols = ['❤️', '💖', '✨', '💕', '🌸'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      heart.style.fontSize = Math.random() * 15 + 15 + 'px';
      heartsContainer.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 300);

    // Dynamic Dodge Logic for NO button
    let yesScale = 1;
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      // Make Yes button bigger each time No is touched
      yesScale += 0.2;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Calculate random pos for No button
      const padding = 20;
      const x = Math.random() * (window.innerWidth - noBtn.clientWidth - padding * 2) + padding;
      const y = Math.random() * (window.innerHeight - noBtn.clientHeight - padding * 2) + padding;

      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    // YES Click Handler
    function sayYes() {
      const card = document.getElementById('card');
      card.innerHTML = `
        <div style="font-size: 80px;">💍✨</div>
        <div class="celebration-text">Yay! I Knew It! ❤️</div>
        <p style="margin-top: 15px; font-size: 1.1rem; color: #444;">
          You just made me the happiest person in the world! 🥰🥰
        </p>
      `;

      // Trigger Confetti & Heart Fireworks
      const duration = 5 * 1000;
      const animationEnd = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff4b2b', '#ff758c', '#ffffff', '#ffd1dc']
        });
        confetti({
          particleCount: 7,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff4b2b', '#ff758c', '#ffffff', '#ffd1dc']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      })();
    }
  </script>
</body>
</html>
